
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFC KABADDI PRO 2026 - LIVE OVERLAY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 height:100%;
 background:transparent;
 font-family:Arial,Helvetica,sans-serif;
 color:white;
 overflow:hidden;
}

#overlay{
 width:100%;
 padding:18px;
}

.scoreboard{
 width:min(900px,100%);
 margin:auto;
 background:linear-gradient(120deg,
 rgba(5,25,28,.96),
 rgba(10,65,62,.94));
 border:2px solid rgba(255,255,255,.35);
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 5px 25px rgba(0,0,0,.35);
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 18px;
 background:#092e30;
 border-bottom:1px solid rgba(255,255,255,.2);
}

.brand{
 font-size:15px;
 font-weight:900;
 letter-spacing:1px;
 color:#ffd65a;
}

.tournament{
 font-size:13px;
 color:#fff;
 text-align:right;
}

.teams{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 align-items:center;
 gap:12px;
 padding:20px 18px;
}

.team{
 text-align:center;
 min-width:0;
}

.team-name{
 font-size:clamp(15px,3vw,25px);
 font-weight:900;
 overflow-wrap:anywhere;
}

.score{
 font-size:clamp(38px,8vw,65px);
 font-weight:900;
 line-height:1.1;
 margin-top:5px;
}

.vs{
 font-size:16px;
 font-weight:900;
 color:#ffd65a;
}

.details{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 padding:11px 18px;
 background:rgba(0,0,0,.35);
}

.status{
 font-size:13px;
 font-weight:900;
 color:#ffdf62;
}

.timers{
 display:flex;
 gap:15px;
 font-size:13px;
 font-weight:bold;
}

.raider{
 text-align:center;
 padding:10px;
 background:rgba(0,0,0,.25);
 font-size:17px;
 font-weight:900;
 letter-spacing:1px;
}

.animation{
 display:none;
 position:fixed;
 left:50%;
 top:40%;
 transform:translate(-50%,-50%);
 padding:18px 30px;
 border:3px solid #ffd65a;
 border-radius:15px;
 background:rgba(0,0,0,.9);
 color:#ffd65a;
 font-size:clamp(25px,6vw,55px);
 font-weight:1000;
 text-align:center;
 white-space:nowrap;
 z-index:10;
 box-shadow:0 0 35px rgba(255,214,90,.4);
}

.animation.show{
 display:block;
 animation:pop .45s ease;
}

@keyframes pop{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.result{
 display:none;
 text-align:center;
 padding:12px;
 background:#e6b83f;
 color:#172323;
 font-size:20px;
 font-weight:1000;
}

.result.show{display:block}

.error{
 color:white;
 background:rgba(120,0,0,.9);
 padding:15px;
 border-radius:10px;
 text-align:center;
 font-weight:bold;
}

@media(max-width:500px){
 #overlay{padding:8px}
 .header{padding:8px 10px}
 .teams{padding:15px 8px;gap:5px}
 .details{padding:9px}
 .timers{gap:8px;font-size:11px}
 .brand{font-size:12px}
 .tournament{font-size:11px}
 .raider{font-size:14px}
}
</style>
</head>

<body>

<div id="overlay">
 <div class="scoreboard">

  <div class="header">
   <div class="brand">GFC KABADDI PRO 2026</div>
   <div class="tournament" id="tournament">
    KABADDI LIVE
   </div>
  </div>

  <div class="teams">
   <div class="team">
    <div class="team-name" id="teamA">TEAM A</div>
    <div class="score" id="scoreA">0</div>
   </div>

   <div class="vs">VS</div>

   <div class="team">
    <div class="team-name" id="teamB">TEAM B</div>
    <div class="score" id="scoreB">0</div>
   </div>
  </div>

  <div class="details">
   <div class="status" id="status">UPCOMING</div>

   <div class="timers">
    <div>HALF: <span id="half">1</span></div>
    <div>RAID: <span id="raidTimer">30</span>s</div>
    <div>MATCH: <span id="matchTimer">--:--</span></div>
   </div>
  </div>

  <div class="raider">
   RAID: <span id="raider">RAIDER</span>
  </div>

  <div class="result" id="result"></div>

 </div>
</div>

<div class="animation" id="animation"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://wpefjtjcnvdnbsenfukg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_S4f62Pm60kGqVx9T-6rf7A_oGMDBmfw";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const params = new URLSearchParams(location.search);
const token = params.get("token");

let previousAnimation = "";
let animationTimeout = null;

function showError(message){
 document.getElementById("overlay").innerHTML =
 '<div class="error">'+message+'</div>';
}

function formatTime(seconds){
 seconds = Math.max(0,Number(seconds)||0);
 const min = Math.floor(seconds/60);
 const sec = seconds%60;
 return String(min).padStart(2,"0")+":"+
        String(sec).padStart(2,"0");
}

function showAnimation(label){
 if(!label || label === previousAnimation) return;

 previousAnimation = label;

 const el = document.getElementById("animation");
 el.textContent = label;
 el.classList.add("show");

 clearTimeout(animationTimeout);

 animationTimeout = setTimeout(()=>{
  el.classList.remove("show");
 },3000);
}

async function loadOverlay(){

 if(!token){
  showError("Overlay token missing. Please check your URL.");
  return;
 }

 const {data,error} = await db.rpc(
  "get_match_overlay",
  {p_token:token}
 );

 if(error){
  console.error(error);
  showError("Unable to load overlay data.");
  return;
 }

 if(!data){
  showError("Invalid or disabled overlay link.");
  return;
 }

 document.getElementById("tournament").textContent =
  data.tournament || "KABADDI LIVE";

 document.getElementById("teamA").textContent =
  data.team_a || "TEAM A";

 document.getElementById("teamB").textContent =
  data.team_b || "TEAM B";

 document.getElementById("scoreA").textContent =
  data.score_a ?? 0;

 document.getElementById("scoreB").textContent =
  data.score_b ?? 0;

 document.getElementById("status").textContent =
  String(data.status || "UPCOMING").toUpperCase();

 document.getElementById("half").textContent =
  data.half ?? 1;

 document.getElementById("raidTimer").textContent =
  data.raid_timer ?? 30;

 document.getElementById("matchTimer").textContent =
  data.match_timer == null
   ? "--:--"
   : formatTime(data.match_timer);

 document.getElementById("raider").textContent =
  data.raider || "RAIDER";

 if(data.last_animation){
  showAnimation(data.last_animation);
 }

 const result = document.getElementById("result");

 if(data.result_type === "draw"){
  result.textContent = "MATCH DRAW";
  result.classList.add("show");
 }else if(data.result_type === "winner"){
  const winner =
   data.winner_team_id &&
   data.winner_team_id === data.team_a_id
    ? data.team_a
    : data.winner_team || "WINNER";

  result.textContent = "MATCH COMPLETED";
  result.classList.add("show");
 }else{
  result.classList.remove("show");
 }
}

loadOverlay();
setInterval(loadOverlay,1500);
</script>

</body>
</html>
