
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFC KABADDI PRO 2026 - LIVE BROADCAST</title>

<style>
:root{
 --accent:#d9b65d;
 --accent2:#ffe9a0;
 --red:#ff3549;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 min-height:100%;
 background:transparent;
 font-family:Arial,Helvetica,sans-serif;
 color:white;
 overflow:hidden;
}

#overlay{width:100%;padding:20px}

.broadcast{
 position:relative;
 width:min(1100px,100%);
 margin:auto;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.24);
 border-radius:18px;
 background:linear-gradient(115deg,
 rgba(4,20,19,.98),
 rgba(12,57,49,.98),
 rgba(4,22,21,.98));
 box-shadow:0 12px 45px rgba(0,0,0,.5);
}

.topbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:12px 20px;
 background:linear-gradient(90deg,#061b19,#154438);
 border-bottom:1px solid rgba(255,255,255,.14);
}

.brand{display:flex;align-items:center;gap:10px}

.brand-icon{
 width:38px;height:38px;
 display:grid;place-items:center;
 border-radius:10px;
 background:linear-gradient(145deg,#ffe7a0,#b98b30);
 color:#172a20;
 font-size:18px;font-weight:1000;
}

.brand-name{
 font-size:17px;font-weight:1000;
 letter-spacing:1.2px;
}

.brand-sub{
 margin-top:3px;
 color:var(--accent);
 font-size:9px;
 letter-spacing:3px;
 font-weight:900;
}

.tournament{
 max-width:42%;
 text-align:center;
 color:#e0eee8;
 font-size:12px;
 font-weight:900;
 letter-spacing:1px;
 overflow-wrap:anywhere;
}

.live-badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 padding:7px 11px;
 border:1px solid rgba(255,70,80,.5);
 border-radius:5px;
 background:rgba(255,50,65,.13);
 color:#ff6875;
 font-size:11px;
 font-weight:1000;
 letter-spacing:1px;
}

.live-dot{
 width:7px;height:7px;
 border-radius:50%;
 background:#ff3549;
 box-shadow:0 0 10px #ff3549;
 animation:pulse 1s infinite;
}

@keyframes pulse{
 50%{opacity:.35;transform:scale(.75)}
}

.score-area{
 display:grid;
 grid-template-columns:1fr 170px 1fr;
 align-items:center;
 gap:12px;
 padding:23px 22px;
}

.team{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:15px;
 min-width:0;
}

.team-a{flex-direction:row}
.team-b{flex-direction:row-reverse}

.team-logo{
 width:82px;height:82px;
 flex:0 0 82px;
 display:grid;
 place-items:center;
 overflow:hidden;
 border-radius:50%;
 border:3px solid var(--accent);
 background:linear-gradient(145deg,#164b3d,#071c19);
 box-shadow:0 0 18px rgba(217,182,93,.2);
}

.team-logo img{
 width:100%;height:100%;
 object-fit:cover;
 display:none;
}

.team-logo .fallback{
 font-size:29px;
 font-weight:1000;
 color:var(--accent2);
}

.team-info{
 min-width:0;
 text-align:center;
}

.team-label{
 color:#b8d0c9;
 font-size:9px;
 font-weight:900;
 letter-spacing:2px;
 margin-bottom:5px;
}

.team-name{
 max-width:190px;
 font-size:clamp(16px,2.6vw,25px);
 line-height:1.15;
 font-weight:1000;
 overflow-wrap:anywhere;
}

.score{
 display:block;
 margin-top:5px;
 font-size:clamp(48px,7vw,76px);
 line-height:1;
 font-weight:1000;
 letter-spacing:-2px;
 text-shadow:0 4px 15px rgba(0,0,0,.4);
}

.score.changed{animation:scorePop .55s ease}

@keyframes scorePop{
 0%{transform:scale(1)}
 40%{transform:scale(1.2);color:var(--accent2)}
 100%{transform:scale(1)}
}

.center-panel{
 padding:14px 8px;
 text-align:center;
 border:1px solid rgba(217,182,93,.35);
 border-radius:13px;
 background:rgba(0,0,0,.3);
}

.vs{
 color:var(--accent);
 font-size:13px;
 font-weight:1000;
 letter-spacing:3px;
}

.half-label{
 margin-top:9px;
 color:#c9ddd5;
 font-size:10px;
 font-weight:900;
 letter-spacing:1px;
}

.match-time{
 margin-top:5px;
 font-size:27px;
 font-weight:1000;
 font-variant-numeric:tabular-nums;
}

.timer-line{
 height:1px;
 margin:10px 0;
 background:rgba(255,255,255,.15);
}

.raid-label{
 color:#b8d0c9;
 font-size:9px;
 font-weight:900;
 letter-spacing:2px;
}

.raid-time{
 margin-top:4px;
 color:var(--accent2);
 font-size:24px;
 font-weight:1000;
 font-variant-numeric:tabular-nums;
}

.bottom-bar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap;
 padding:11px 20px;
 background:rgba(0,0,0,.35);
 border-top:1px solid rgba(255,255,255,.12);
}

.match-status{
 display:flex;
 align-items:center;
 gap:8px;
 color:var(--accent2);
 font-size:11px;
 font-weight:1000;
 letter-spacing:1px;
}

.status-mark{
 width:7px;height:7px;
 border-radius:50%;
 background:var(--accent);
}

.raider-box{
 display:flex;
 align-items:center;
 gap:11px;
}

.raider-photo{
 width:43px;height:43px;
 flex:0 0 43px;
 display:grid;
 place-items:center;
 overflow:hidden;
 border:2px solid var(--accent);
 border-radius:50%;
 background:#173e34;
 color:var(--accent2);
 font-size:17px;
 font-weight:1000;
}

.raider-photo img{
 width:100%;height:100%;
 object-fit:cover;
 display:none;
}

.raider-details{min-width:0}

.raider-tag{
 color:#a9c4ba;
 font-size:8px;
 font-weight:900;
 letter-spacing:2px;
}

.raider-name{
 margin-top:3px;
 color:white;
 font-size:13px;
 font-weight:1000;
}

.raider-jersey{
 margin-top:2px;
 color:var(--accent2);
 font-size:10px;
 font-weight:800;
}

.result{
 display:none;
 padding:13px;
 text-align:center;
 color:#17271e;
 background:linear-gradient(90deg,#c99b36,#ffe6a0,#c99b36);
 font-size:19px;
 font-weight:1000;
 letter-spacing:1px;
}

.result.show{display:block}

.footer{
 padding:7px;
 text-align:center;
 background:rgba(0,0,0,.22);
 color:rgba(255,255,255,.5);
 font-size:8px;
 font-weight:900;
 letter-spacing:3px;
}

.animation{
 display:none;
 position:fixed;
 top:43%;left:50%;
 transform:translate(-50%,-50%);
 z-index:20;
 max-width:90%;
 padding:20px 32px;
 border:2px solid var(--accent);
 border-radius:15px;
 background:rgba(3,18,16,.96);
 color:var(--accent2);
 text-align:center;
 font-size:clamp(25px,6vw,52px);
 font-weight:1000;
 white-space:nowrap;
 box-shadow:0 0 40px rgba(217,182,93,.4);
}

.animation.show{
 display:block;
 animation:popIn .4s ease;
}

@keyframes popIn{
 from{opacity:0;transform:translate(-50%,-50%) scale(.55)}
 to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* Colour variants */

.broadcast.blue{
 --accent:#55c7ff;
 --accent2:#b8eaff;
}

.broadcast.red{
 --accent:#ff6565;
 --accent2:#ffc0c0;
}

.broadcast.purple{
 --accent:#c58aff;
 --accent2:#e5caff;
}

.broadcast.orange{
 --accent:#ffad55;
 --accent2:#ffe0ad;
}

.error{
 max-width:600px;
 margin:20px auto;
 padding:15px;
 border:1px solid #ff5965;
 border-radius:10px;
 background:rgba(80,0,0,.9);
 text-align:center;
 font-weight:bold;
}

@media(max-width:650px){
 #overlay{padding:8px}
 .broadcast{border-radius:11px}
 .topbar{padding:9px 10px;gap:5px}
 .brand-icon{width:29px;height:29px;font-size:13px}
 .brand-name{font-size:11px}
 .brand-sub{font-size:7px;letter-spacing:2px}
 .tournament{font-size:9px}
 .live-badge{padding:5px 6px;font-size:8px}
 .score-area{
  grid-template-columns:1fr 90px 1fr;
  gap:4px;
  padding:17px 6px;
 }
 .team{gap:5px}
 .team-logo{
  width:43px;height:43px;
  flex-basis:43px;
  border-width:2px;
 }
 .team-logo .fallback{font-size:18px}
 .team-label{font-size:7px;letter-spacing:1px}
 .team-name{font-size:clamp(11px,2.8vw,17px)}
 .score{font-size:clamp(38px,9vw,55px)}
 .center-panel{padding:10px 3px}
 .vs{font-size:10px}
 .half-label{font-size:8px}
 .match-time{font-size:19px}
 .raid-label{font-size:7px}
 .raid-time{font-size:18px}
 .bottom-bar{padding:8px 10px}
 .match-status{font-size:9px}
 .raider-photo{width:36px;height:36px;flex-basis:36px}
 .raider-name{font-size:11px}
 .footer{font-size:7px}
}

@media(max-width:360px){
 .score-area{grid-template-columns:1fr 75px 1fr}
 .team-logo{width:35px;height:35px;flex-basis:35px}
 .score{font-size:36px}
 .match-time{font-size:16px}
 .team-name{font-size:11px}
 .brand-name{font-size:9px}
}
</style>
</head>

<body>

<div id="overlay">
 <div class="broadcast" id="broadcast">

  <div class="topbar">

   <div class="brand">
    <div class="brand-icon">G</div>
    <div>
     <div class="brand-name">GFC KABADDI PRO</div>
     <div class="brand-sub">SEASON 2026</div>
    </div>
   </div>

   <div class="tournament" id="tournament">
    KABADDI CHAMPIONSHIP
   </div>

   <div class="live-badge" id="liveBadge">
    <span class="live-dot"></span> LIVE
   </div>

  </div>

  <div class="score-area">

   <!-- TEAM A -->
   <div class="team team-a">

    <div class="team-logo">
     <img id="logoA" alt="Team A Logo">
     <span class="fallback" id="fallbackA">A</span>
    </div>

    <div class="team-info">
     <div class="team-label">HOME TEAM</div>
     <div class="team-name" id="teamA">TEAM A</div>
     <div class="score" id="scoreA">0</div>
    </div>

   </div>

   <!-- MATCH TIMER -->
   <div class="center-panel">
    <div class="vs">VS</div>
    <div class="half-label" id="halfLabel">1ST HALF</div>
    <div class="match-time" id="matchTimer">--:--</div>
    <div class="timer-line"></div>
    <div class="raid-label">RAID TIMER</div>
    <div class="raid-time" id="raidTimer">30</div>
   </div>

   <!-- TEAM B -->
   <div class="team team-b">

    <div class="team-logo">
     <img id="logoB" alt="Team B Logo">
     <span class="fallback" id="fallbackB">B</span>
    </div>

    <div class="team-info">
     <div class="team-label">AWAY TEAM</div>
     <div class="team-name" id="teamB">TEAM B</div>
     <div class="score" id="scoreB">0</div>
    </div>

   </div>

  </div>

  <div class="bottom-bar">

   <div class="match-status">
    <span class="status-mark"></span>
    <span id="status">UPCOMING</span>
   </div>

   <!-- CURRENT RAIDER -->
   <div class="raider-box">

    <div class="raider-photo">
     <img id="raiderPhoto" alt="Raider Photo">
     <span id="raiderFallback">R</span>
    </div>

    <div class="raider-details">
     <div class="raider-tag">CURRENT RAIDER</div>
     <div class="raider-name" id="raider">---</div>
     <div class="raider-jersey" id="raiderJersey"></div>
    </div>

   </div>

  </div>

  <div class="result" id="result"></div>

  <div class="footer">
   GFC KABADDI PRO 2026 • OFFICIAL LIVE SCOREBOARD
  </div>

 </div>
</div>

<div class="animation" id="animation"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://wpefjtjcnvdnbsenfukg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_S4f62Pm60kGqVx9T-6rf7A_oGMDBmfw";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const params = new URLSearchParams(location.search);
const token = params.get("token");

let previousAnimation = "";
let previousScoreA = null;
let previousScoreB = null;
let animationTimeout = null;
let loading = false;

const $ = id => document.getElementById(id);

function safeText(value,fallback=""){
 return value == null || value === ""
  ? fallback
  : String(value);
}

function formatTime(seconds){
 seconds = Math.max(0,Math.floor(Number(seconds)||0));
 const min = Math.floor(seconds/60);
 const sec = seconds%60;

 return String(min).padStart(2,"0")+":"+
        String(sec).padStart(2,"0");
}

function setImage(imgId,fallbackId,url,letter){

 const img = $(imgId);
 const fallback = $(fallbackId);

 fallback.textContent = letter || "?";
 img.onerror = function(){
  img.style.display = "none";
  fallback.style.display = "grid";
 };

 if(url){
  img.style.display = "block";
  fallback.style.display = "none";
  img.src = url;
 }else{
  img.removeAttribute("src");
  img.style.display = "none";
  fallback.style.display = "grid";
 }
}

function updateScore(id,value,previous){
 const el = $(id);
 const current = Number(value ?? 0);

 el.textContent = current;

 if(previous !== null && current !== previous){
  el.classList.remove("changed");
  void el.offsetWidth;
  el.classList.add("changed");
 }

 return current;
}

function applyColourVariant(value){
 const box = $("broadcast");

 box.classList.remove(
  "blue","red","purple","orange"
 );

 const variant = String(value || "gold").toLowerCase();

 if(variant.includes("blue")) box.classList.add("blue");
 else if(variant.includes("red")) box.classList.add("red");
 else if(variant.includes("purple")) box.classList.add("purple");
 else if(variant.includes("orange")) box.classList.add("orange");
}

function showAnimation(label){
 if(!label || label === previousAnimation) return;

 previousAnimation = label;

 const el = $("animation");
 el.textContent = label;
 el.classList.add("show");

 clearTimeout(animationTimeout);

 animationTimeout = setTimeout(()=>{
  el.classList.remove("show");
 },3000);
}

function updateOverlay(data){

 $("tournament").textContent =
  safeText(data.tournament,"KABADDI CHAMPIONSHIP");

 $("teamA").textContent =
  safeText(data.team_a_full || data.team_a,"TEAM A");

 $("teamB").textContent =
  safeText(data.team_b_full || data.team_b,"TEAM B");

 // Team logos
 setImage(
  "logoA",
  "fallbackA",
  data.team_a_logo,
  "A"
 );

 setImage(
  "logoB",
  "fallbackB",
  data.team_b_logo,
  "B"
 );

 // Scores
 previousScoreA = updateScore(
  "scoreA",data.score_a,previousScoreA
 );

 previousScoreB = updateScore(
  "scoreB",data.score_b,previousScoreB
 );

 // Status
 const status = safeText(data.status,"UPCOMING").toUpperCase();
 $("status").textContent = status;

 const badge = $("liveBadge");

 if(status === "LIVE"){
  badge.innerHTML = '<span class="live-dot"></span> LIVE';
  badge.style.color = "#ff6875";
  badge.style.borderColor = "rgba(255,70,80,.5)";
  badge.style.background = "rgba(255,50,65,.13)";
 }else{
  badge.textContent = status;
  badge.style.color = "#ffe9a0";
  badge.style.borderColor = "rgba(255,255,255,.25)";
  badge.style.background = "rgba(255,255,255,.08)";
 }

 // Half
 const half = Number(data.half || 1);

 $("halfLabel").textContent =
  half === 1 ? "1ST HALF" :
  half === 2 ? "2ND HALF" :
  "HALF " + half;

 // Timers
 $("raidTimer").textContent =
  data.raid_timer ?? 30;

 $("matchTimer").textContent =
  data.match_timer == null
   ? "--:--"
   : formatTime(data.match_timer);

 // Raider details
 const raiderName = safeText(data.raider,"---");

 $("raider").textContent = raiderName;

 setImage(
  "raiderPhoto",
  "raiderFallback",
  data.raider_photo,
  raiderName.charAt(0).toUpperCase()
 );

 $("raiderJersey").textContent =
  data.raider_jersey_number != null
   ? "JERSEY #" + data.raider_jersey_number
   : "";

 // Colour
 applyColourVariant(data.color_variant);

 // Scoring animation
 if(data.last_animation){
  showAnimation(data.last_animation);
 }

 // Result
 const result = $("result");

 if(data.result_type === "draw"){
  result.textContent = "🏆 MATCH DRAW";
  result.classList.add("show");
 }else if(data.result_type === "winner"){
  const winner = safeText(data.winner_team_name,"WINNER");
  result.textContent = "🏆 " + winner + " WON THE MATCH";
  result.classList.add("show");
 }else{
  result.classList.remove("show");
 }
}

async function loadOverlay(){

 if(loading) return;
 loading = true;

 try{

  if(!token){
   showError("Overlay token missing. Please check your URL.");
   return;
  }

  const {data,error} = await db.rpc(
   "get_match_overlay",
   {p_token:token}
  );

  if(error){
   console.error("Overlay error:",error);
   return;
  }

  if(!data){
   showError("Invalid or disabled overlay link.");
   return;
  }

  updateOverlay(data);

 }catch(error){
  console.error(error);
 }finally{
  loading = false;
 }
}

function showError(message){
 $("overlay").innerHTML =
  '<div class="error">'+message+'</div>';
}

loadOverlay();
setInterval(loadOverlay,1500);
</script>

</body>
</html>
