
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFC KABADDI PRO 2026 - LIVE BROADCAST</title>

<style>
:root{
 --accent:#d9b65d;
 --accent2:#ffe9a0;
 --bg1:#071b19;
 --bg2:#103c34;
 --panel:#0b2926;
 --white:#ffffff;
 --muted:#b8d0c9;
 --red:#ff404d;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 min-height:100%;
 background:transparent;
 font-family:Arial,Helvetica,sans-serif;
 color:var(--white);
 overflow:hidden;
}

#overlay{
 width:100%;
 padding:20px;
}

.broadcast{
 position:relative;
 width:min(1050px,100%);
 margin:auto;
 border:1px solid rgba(255,255,255,.22);
 border-radius:18px;
 overflow:hidden;
 background:
 linear-gradient(115deg,
 rgba(5,23,22,.98),
 rgba(13,59,51,.97) 55%,
 rgba(5,25,24,.98));
 box-shadow:0 12px 45px rgba(0,0,0,.45);
}

.broadcast:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(
  110deg,
  transparent 20%,
  rgba(255,255,255,.035) 50%,
  transparent 80%);
}

.topbar{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:12px 20px;
 background:linear-gradient(90deg,#071b19,#123d34);
 border-bottom:1px solid rgba(255,255,255,.13);
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.brand-icon{
 width:37px;
 height:37px;
 display:grid;
 place-items:center;
 border-radius:10px;
 background:linear-gradient(145deg,#ffe7a0,#b98b30);
 color:#152b24;
 font-size:17px;
 font-weight:1000;
 box-shadow:0 3px 12px rgba(217,182,93,.25);
}

.brand-name{
 font-size:17px;
 font-weight:1000;
 letter-spacing:1.3px;
}

.brand-sub{
 margin-top:3px;
 font-size:9px;
 letter-spacing:3px;
 color:var(--accent);
 font-weight:800;
}

.tournament{
 max-width:45%;
 text-align:right;
 font-size:12px;
 font-weight:800;
 color:#d8e9e2;
 letter-spacing:1px;
 overflow-wrap:anywhere;
}

.live-badge{
 display:inline-flex;
 align-items:center;
 gap:7px;
 padding:7px 12px;
 border-radius:5px;
 background:rgba(255,50,65,.14);
 border:1px solid rgba(255,70,80,.5);
 color:#ff6670;
 font-size:11px;
 font-weight:1000;
 letter-spacing:1.5px;
}

.live-dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#ff3447;
 box-shadow:0 0 10px #ff3447;
 animation:pulse 1s infinite;
}

@keyframes pulse{
 50%{opacity:.35;transform:scale(.75)}
}

.score-area{
 position:relative;
 display:grid;
 grid-template-columns:1fr 170px 1fr;
 align-items:center;
 gap:12px;
 padding:27px 25px 24px;
}

.team{
 min-width:0;
 text-align:center;
}

.team-label{
 color:var(--muted);
 font-size:10px;
 font-weight:900;
 letter-spacing:2px;
 margin-bottom:10px;
}

.team-name{
 font-size:clamp(17px,3vw,28px);
 font-weight:1000;
 line-height:1.15;
 overflow-wrap:anywhere;
 text-shadow:0 3px 12px rgba(0,0,0,.4);
}

.score{
 display:inline-block;
 min-width:100px;
 margin-top:8px;
 font-size:clamp(55px,9vw,88px);
 line-height:1;
 font-weight:1000;
 letter-spacing:-3px;
 color:#fff;
 text-shadow:0 4px 18px rgba(0,0,0,.4);
}

.score.changed{
 animation:scorePop .55s ease;
}

@keyframes scorePop{
 0%{transform:scale(1)}
 40%{transform:scale(1.22);color:var(--accent2)}
 100%{transform:scale(1)}
}

.center-panel{
 text-align:center;
 padding:15px 8px;
 border-radius:14px;
 border:1px solid rgba(217,182,93,.3);
 background:linear-gradient(145deg,rgba(0,0,0,.35),rgba(14,52,45,.7));
}

.vs{
 color:var(--accent);
 font-size:13px;
 font-weight:1000;
 letter-spacing:3px;
}

.half-label{
 margin-top:9px;
 color:#c7d9d2;
 font-size:10px;
 font-weight:900;
 letter-spacing:1.5px;
}

.match-time{
 margin-top:5px;
 font-size:27px;
 font-weight:1000;
 font-variant-numeric:tabular-nums;
 letter-spacing:1px;
}

.timer-line{
 height:1px;
 margin:10px 0;
 background:rgba(255,255,255,.15);
}

.raid-label{
 color:var(--muted);
 font-size:9px;
 font-weight:900;
 letter-spacing:2px;
}

.raid-time{
 margin-top:4px;
 color:var(--accent2);
 font-size:24px;
 font-weight:1000;
 font-variant-numeric:tabular-nums;
}

.bottom-bar{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap;
 padding:12px 20px;
 background:rgba(0,0,0,.35);
 border-top:1px solid rgba(255,255,255,.12);
}

.match-status{
 display:flex;
 align-items:center;
 gap:8px;
 font-size:11px;
 font-weight:1000;
 letter-spacing:1.3px;
 color:var(--accent2);
}

.status-mark{
 width:7px;
 height:7px;
 border-radius:50%;
 background:var(--accent);
}

.raider-box{
 display:flex;
 align-items:center;
 gap:9px;
 font-size:12px;
 font-weight:900;
}

.raider-tag{
 color:var(--muted);
 font-size:9px;
 letter-spacing:1.5px;
}

.raider-name{
 color:#fff;
}

.footer{
 display:flex;
 justify-content:center;
 padding:7px;
 background:rgba(0,0,0,.22);
 color:rgba(255,255,255,.48);
 font-size:8px;
 font-weight:900;
 letter-spacing:3px;
}

.result{
 display:none;
 position:relative;
 padding:13px 15px;
 text-align:center;
 color:#17271e;
 background:linear-gradient(90deg,#c99b36,#ffe6a0,#c99b36);
 font-size:19px;
 font-weight:1000;
 letter-spacing:1.5px;
}

.result.show{display:block}

.animation{
 display:none;
 position:fixed;
 top:43%;
 left:50%;
 transform:translate(-50%,-50%);
 z-index:20;
 min-width:230px;
 max-width:90%;
 padding:20px 35px;
 text-align:center;
 white-space:nowrap;
 border:2px solid var(--accent);
 border-radius:15px;
 color:var(--accent2);
 background:rgba(3,18,16,.96);
 box-shadow:0 0 40px rgba(217,182,93,.35);
 font-size:clamp(25px,6vw,52px);
 font-weight:1000;
 letter-spacing:2px;
}

.animation.show{
 display:block;
 animation:popIn .4s ease;
}

@keyframes popIn{
 from{opacity:0;transform:translate(-50%,-50%) scale(.55)}
 to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.error{
 max-width:600px;
 margin:20px auto;
 padding:15px;
 border:1px solid #ff5965;
 border-radius:10px;
 background:rgba(80,0,0,.9);
 color:#fff;
 text-align:center;
 font-weight:bold;
}

/* Colour variants */
.broadcast.gold{
 --accent:#d9b65d;
 --accent2:#ffe9a0;
}
.broadcast.blue{
 --accent:#55c7ff;
 --accent2:#b8eaff;
}
.broadcast.red{
 --accent:#ff6565;
 --accent2:#ffc0c0;
}
.broadcast.purple{
 --accent:#c58aff;
 --accent2:#e5caff;
}
.broadcast.orange{
 --accent:#ffad55;
 --accent2:#ffe0ad;
}

/* Compact layout */
@media(max-width:600px){
 #overlay{padding:8px}
 .broadcast{border-radius:11px}
 .topbar{padding:9px 10px}
 .brand-icon{width:29px;height:29px;font-size:13px}
 .brand-name{font-size:12px}
 .brand-sub{font-size:7px;letter-spacing:2px}
 .tournament{font-size:9px}
 .live-badge{padding:5px 7px;font-size:9px}
 .score-area{
  grid-template-columns:1fr 95px 1fr;
  gap:4px;
  padding:19px 7px;
 }
 .team-label{font-size:8px;letter-spacing:1px}
 .team-name{font-size:clamp(13px,3vw,19px)}
 .score{font-size:clamp(43px,10vw,60px);min-width:0}
 .center-panel{padding:11px 4px}
 .vs{font-size:10px}
 .half-label{font-size:8px}
 .match-time{font-size:20px}
 .raid-label{font-size:7px}
 .raid-time{font-size:19px}
 .bottom-bar{padding:9px 10px}
 .match-status{font-size:9px}
 .raider-box{font-size:10px}
 .footer{font-size:7px}
}

@media(max-width:350px){
 .score-area{grid-template-columns:1fr 75px 1fr}
 .match-time{font-size:17px}
 .score{font-size:39px}
 .brand-name{font-size:10px}
}
</style>
</head>

<body>

<div id="overlay">
 <div class="broadcast gold" id="broadcast">

  <div class="topbar">
   <div class="brand">
    <div class="brand-icon">G</div>
    <div>
     <div class="brand-name">GFC KABADDI PRO</div>
     <div class="brand-sub">SEASON 2026</div>
    </div>
   </div>

   <div class="tournament" id="tournament">
    KABADDI CHAMPIONSHIP
   </div>

   <div class="live-badge" id="liveBadge">
    <span class="live-dot"></span>
    LIVE
   </div>
  </div>

  <div class="score-area">

   <div class="team">
    <div class="team-label">HOME TEAM</div>
    <div class="team-name" id="teamA">TEAM A</div>
    <div class="score" id="scoreA">0</div>
   </div>

   <div class="center-panel">
    <div class="vs">VS</div>
    <div class="half-label" id="halfLabel">1ST HALF</div>
    <div class="match-time" id="matchTimer">--:--</div>
    <div class="timer-line"></div>
    <div class="raid-label">RAID TIMER</div>
    <div class="raid-time" id="raidTimer">30</div>
   </div>

   <div class="team">
    <div class="team-label">AWAY TEAM</div>
    <div class="team-name" id="teamB">TEAM B</div>
    <div class="score" id="scoreB">0</div>
   </div>

  </div>

  <div class="bottom-bar">
   <div class="match-status">
    <span class="status-mark"></span>
    <span id="status">UPCOMING</span>
   </div>

   <div class="raider-box">
    <span class="raider-tag">RAIDER</span>
    <span class="raider-name" id="raider">---</span>
   </div>
  </div>

  <div class="result" id="result"></div>

  <div class="footer">
   GFC KABADDI PRO 2026 • OFFICIAL LIVE SCOREBOARD
  </div>

 </div>
</div>

<div class="animation" id="animation"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://wpefjtjcnvdnbsenfukg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_S4f62Pm60kGqVx9T-6rf7A_oGMDBmfw";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const params = new URLSearchParams(location.search);
const token = params.get("token");

let previousAnimation = "";
let previousScoreA = null;
let previousScoreB = null;
let animationTimeout = null;
let loading = false;

const $ = id => document.getElementById(id);

function safeText(value,fallback=""){
 return value == null || value === ""
  ? fallback
  : String(value);
}

function formatTime(seconds){
 seconds = Math.max(0,Math.floor(Number(seconds)||0));
 const min = Math.floor(seconds/60);
 const sec = seconds%60;

 return String(min).padStart(2,"0")+":"+
        String(sec).padStart(2,"0");
}

function showError(message){
 $("overlay").innerHTML =
 '<div class="error">'+message+'</div>';
}

function showAnimation(label){
 if(!label || label === previousAnimation) return;

 previousAnimation = label;

 const el = $("animation");
 el.textContent = label;
 el.classList.add("show");

 clearTimeout(animationTimeout);

 animationTimeout = setTimeout(()=>{
  el.classList.remove("show");
 },3000);
}

function updateScore(elementId,value,previous){
 const el = $(elementId);
 const current = Number(value ?? 0);

 el.textContent = current;

 if(previous !== null && current !== previous){
  el.classList.remove("changed");
  void el.offsetWidth;
  el.classList.add("changed");
 }

 return current;
}

function applyColourVariant(value){
 const box = $("broadcast");

 box.classList.remove(
  "gold","blue","red","purple","orange"
 );

 const variant = String(value || "gold").toLowerCase();

 if(variant.includes("blue")) box.classList.add("blue");
 else if(variant.includes("red")) box.classList.add("red");
 else if(variant.includes("purple")) box.classList.add("purple");
 else if(variant.includes("orange")) box.classList.add("orange");
 else box.classList.add("gold");
}

function updateOverlay(data){

 $("tournament").textContent =
  safeText(data.tournament || data.tournament_name,"KABADDI CHAMPIONSHIP");

 $("teamA").textContent =
  safeText(data.team_a,"TEAM A");

 $("teamB").textContent =
  safeText(data.team_b,"TEAM B");

 previousScoreA = updateScore(
  "scoreA",data.score_a,previousScoreA
 );

 previousScoreB = updateScore(
  "scoreB",data.score_b,previousScoreB
 );

 const status = safeText(data.status,"UPCOMING").toUpperCase();

 $("status").textContent = status;

 const badge = $("liveBadge");

 if(status === "LIVE"){
  badge.style.display = "inline-flex";
  badge.innerHTML = '<span class="live-dot"></span> LIVE';
 }else{
  badge.style.display = "inline-flex";
  badge.innerHTML = status;
  badge.style.color = "#ffe9a0";
  badge.style.borderColor = "rgba(255,255,255,.25)";
  badge.style.background = "rgba(255,255,255,.08)";
 }

 const half = Number(data.half || 1);

 $("halfLabel").textContent =
  half === 1 ? "1ST HALF" :
  half === 2 ? "2ND HALF" :
  "HALF " + half;

 $("raidTimer").textContent =
  data.raid_timer ?? 30;

 $("matchTimer").textContent =
  data.match_timer == null
   ? "--:--"
   : formatTime(data.match_timer);

 $("raider").textContent =
  safeText(data.raider,"---");

 // Apply selected colour variant if returned by RPC
 applyColourVariant(data.color_variant || data.colour_variant);

 // Last scoring animation
 if(data.last_animation){
  showAnimation(data.last_animation);
 }else if(data.last_event && data.last_event.overlay_label){
  showAnimation(data.last_event.overlay_label);
 }

 // Match result
 const result = $("result");

 if(data.result_type === "draw"){
  result.textContent = "🏆 MATCH DRAW";
  result.classList.add("show");
 }else if(data.result_type === "winner"){
  const winner =
   data.winner_team_id &&
   data.winner_team_id === data.team_a_id
    ? data.team_a
    : safeText(data.winner_team,"WINNER");

  result.textContent = "🏆 " + winner + " WON THE MATCH";
  result.classList.add("show");
 }else{
  result.classList.remove("show");
 }
}

async function loadOverlay(){

 if(loading) return;
 loading = true;

 try{

  if(!token){
   showError("Overlay token missing. Please check your URL.");
   return;
  }

  const {data,error} = await db.rpc(
   "get_match_overlay",
   {p_token:token}
  );

  if(error){
   console.error("Overlay error:",error);
   return;
  }

  if(!data){
   showError("Invalid or disabled overlay link.");
   return;
  }

  updateOverlay(data);

 }catch(error){
  console.error(error);
 }finally{
  loading = false;
 }
}

loadOverlay();
setInterval(loadOverlay,1500);
</script>

</body>
</html>
